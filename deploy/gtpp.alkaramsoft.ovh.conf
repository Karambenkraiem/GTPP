# À copier dans le dossier conf.d/ (ou sites-enabled/) de dataserv-nginx,
# puis: docker exec dataserv-nginx nginx -s reload

server {
    listen 80;
    server_name gtpp.alkaramsoft.ovh;

    # Redirection HTTP -> HTTPS (une fois le certificat émis, voir DEPLOY.md)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gtpp.alkaramsoft.ovh;

    ssl_certificate     /etc/letsencrypt/live/gtpp.alkaramsoft.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtpp.alkaramsoft.ovh/privkey.pem;

    location / {
        proxy_pass http://gtpp_frontend_prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
